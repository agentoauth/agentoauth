[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentoauth-saga"
version = "0.1.0"
description = "AgentOAuth Saga Accountability Layer — verifiable authority + reconciled-outcome proof for multi-step, cross-system agent workflows."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Prithvi" }]
keywords = ["agentoauth", "saga", "consent", "receipt", "authorization", "multi-agent"]
dependencies = [
    "pydantic>=2.6",
    "jwcrypto>=1.5",
    "cryptography>=42",
    "pyyaml>=6",
    "langgraph>=0.2",
    "mongomock>=4.1",
    "httpx>=0.27",
    "rich>=13",
]

[project.optional-dependencies]
mongo = ["pymongo>=4.6"]
# A2A transport + the two org services. The CORE never imports these; only orgs/ do.
a2a = ["a2a-sdk==0.3.7", "uvicorn>=0.30", "sse-starlette>=2.0", "httpx>=0.27"]
supplier = ["crewai>=1.14,<2"]            # CrewAI agent (responder); LLM optional at runtime
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff", "mypy"]

[project.scripts]
saga-view = "agentoauth_saga.viewer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentoauth_saga*"]

[tool.setuptools.package-data]
agentoauth_saga = ["policy/policies/*.yaml", "viewer/web/*.html"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
